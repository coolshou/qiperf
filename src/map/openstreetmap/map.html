<!DOCTYPE html>
<html>
<head>
    <title>Leaflet Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="qrc:/openstreetmap/leaflet.css"  />
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
        }
        .custom-div-icon {
            background: white;
            border: 1px solid #333;
            padding: 2px 5px;
            border-radius: 4px;
            box-shadow: 1px 1px 2px #aaa;
            white-space: nowrap;
        }
        .marker-box {
            display: flex;
            align-items: center;
            /*background: white;*/
            border: 0px solid #333;
            border-radius: 6px;
            padding: 2px 6px;
            /*box-shadow: 1px 1px 3px rgba(0, 0, 0, 0.3);*/
            font-size: 10px;
            font-weight: bold;
            /*color: #222;*//*black?*/
            color: #ff0202;
            white-space: nowrap;
        }

        .marker-box img {
            margin-right: 6px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="qrc:/openstreetmap/leaflet.js"></script>
    <script>
        let markerid = 0;
        let markerMap = {};  // key: ID, value: marker
        var map = L.map('map').setView([%1, %2], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data © <a href="https://openstreetmap.org">OpenStreetMap</a> contributors'
        }).addTo(map);
        // Add or update a marker by ID
        function setMarker(id, lat, lng, label) {
            // If it already exists, remove it
            if (markerMap[id]) {
                map.removeLayer(markerMap[id]);
            }
            var customIcon = L.divIcon({
                html: `<div class="marker-box">
                        <img src="qrc:/openstreetmap/marker.png" width="24" height="24">
                        <span>${label}</span>
                    </div>`,
                iconSize: [48, 24],  // size of the outer div
                className: ''  // prevents default Leaflet styles
            });
            var spopup = lat + " , " + lng;
            const marker = L.marker([lat, lng], { icon: customIcon }).addTo(map)
                .bindPopup(spopup);
            markerMap[id] = marker;
        }
        // Remove a specific marker
        function removeMarker(id) {
            if (markerMap[id]) {
                map.removeLayer(markerMap[id]);
                delete markerMap[id];
            }
        }
        // clear all marker
        function clearMarker() {
            for (let id in markerMap) {
                if (markerMap.hasOwnProperty(id)) {
                    map.removeLayer(markerMap[id]);  // Remove from map
                }
            }
            markerMap = {};  // Clear the reference map
        }
    </script>
</body>
</html>
